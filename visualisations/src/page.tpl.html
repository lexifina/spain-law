<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }

.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(28px, 5vw, 44px)/1.2 var(--serif); margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 780px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }

.tile span { font-size: 12px; color: var(--text-2); line-height: 1.5; display: block; margin-top: 2px; }

details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; line-height: 1.5; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.3 var(--serif); margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 780px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.45 var(--serif); margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 840px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; line-height: 1.5; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, var(--muted-mark) 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.legend i.outline { background: transparent !important; border: 2px solid var(--text); border-radius: 3px; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.6; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .q { margin-top: 4px; color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.4 var(--sans); }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.4 var(--sans); overflow-wrap: anywhere; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.4 var(--sans); color: var(--text-2); overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.15 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.4 var(--sans); }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; line-height: 1.6; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 15px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>

<div class="wrap">
<header class="top">
  <div class="bar">
    <span class="toggles">
      <span class="seg" role="group" aria-label="Idioma / Language"><button data-lang="es">ES</button><button data-lang="en">EN</button></span>
      <span class="seg" role="group" aria-label="Tema / Theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light">☀</button><button data-theme-set="dark">☾</button></span>
    </span>
  </div>
  <h1 data-i="title"></h1>
  <p class="lede" data-i="lede"></p>
  <p class="note" id="gl-link"></p>
  <div class="tiles" id="tiles"></div>

<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile;
const LANGS = ['es', 'en'];
let LANG = 'es';
try { const q = new URLSearchParams(location.search).get('lang'); if (LANGS.includes(q)) LANG = q; else { const s = localStorage.getItem('es-viz-lang'); if (LANGS.includes(s)) LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const tt = localStorage.getItem('es-viz-theme'); if (tt === 'light' || tt === 'dark') THEME = tt; } catch (e) {}

// ------------------------------------------------------------------ strings
const GL = '<a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>';
const S = {
es: {
  title: 'El derecho español en 20 gráficos',
  lede: 'Veinte gráficos dibujados solo con los datos de este repositorio: las {norms} normas de ámbito estatal de la legislación consolidada del BOE, de la Constitución a las órdenes ministeriales, con un archivo por bloque (artículo, disposición, anexo) y un commit por cada norma que cambió su texto, fechado el día en que el cambio entró en vigor.',
  profile_h: 'Perfil de los datos: qué se ha usado y hasta dónde llega',
  tbl: 'Tabla de datos', src: 'Fuente en el repositorio', n: 'Registros', cover: 'Cobertura', caveat: 'Límites',
  ds: 'Datos', foot: 'Elaborado a partir del repositorio lexifina/spain-law ({built}). Basado en datos de la Agencia Estatal Boletín Oficial del Estado (https://www.boe.es): los textos son los textos consolidados del BOE, de carácter meramente informativo; solo los publicados en el «Boletín Oficial del Estado» son oficiales y auténticos. Datos hasta el {record}. Las cifras las calcula visualisations/src/prep.py a partir del historial de git, los archivos de cada norma y las tablas del repositorio; build.py compone la página. Los gráficos describen lo que contiene el registro, no sus causas.',
  year: 'Año', total: 'Total', share: 'Porcentaje', count: 'Número', partial: 'año incompleto',
  gl: 'Gráficos del derecho de todos los países, a partir de todo global-law: ' + GL + '. Aquí, solo los de España.',
},
en: {
  title: 'Spanish law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: the {norms} state norms (ámbito Estatal) of the BOE’s consolidated legislation, from the Constitution to ministerial orders, with one file per block (article, provision, annex) and one commit for each norm that changed its text, dated the day the change took effect.',
  profile_h: 'Data profile: what was used and how far it goes',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit',
  ds: 'Dataset', foot: 'Built from the lexifina/spain-law repository ({built}). Basado en datos de la Agencia Estatal Boletín Oficial del Estado (https://www.boe.es): the texts are the BOE’s consolidated texts, informative only; only the texts published in the «Boletín Oficial del Estado» are official and authentic. Data to {record}. The numbers are computed by visualisations/src/prep.py from the git history, the files of each norm and the repository’s tables; build.py assembles the page. The charts describe what the record holds, not why.',
  year: 'Year', total: 'Total', share: 'Share', count: 'Count', partial: 'partial year',
  gl: 'Charts on every country’s law, from the whole of global-law: ' + GL + '. These are the charts on Spain alone.',
}};
const t = k => S[LANG][k];
const L = (es, en) => LANG === 'es' ? es : en;
const LA = a => Array.isArray(a) ? L(a[0], a[1]) : a;
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'es' ? '.' : ',');
const dec = (v, d = 1) => { const s = Math.abs(+v).toFixed(d); const [a, b] = s.split('.'); return (+v < 0 && +s !== 0 ? '−' : '') + grp(a) + (b ? (LANG === 'es' ? ',' : '.') + b : ''); };
const fmt = n => (n == null ? '–' : Number.isInteger(+n) ? (+n < 0 ? '−' : '') + grp(String(Math.abs(Math.round(+n)))) : dec(+n, 1));
const pv = (v, d = 0) => dec(v, d) + (LANG === 'es' ? ' %' : '%');
const pct = (a, b, d = 0) => b ? pv(100 * a / b, d) : '–';
const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = { es: ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const DOW = { es: ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'], en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'] };
const DOW1 = { es: ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'], en: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] };
const dateTxt = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'es' ? `${d} de ${MES[m - 1]} de ${y}` : `${d} ${MEN[m - 1]} ${y}`; };
const dateShort = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'es' ? `${d} ${MON.es[m - 1]} ${y}` : `${d} ${MON.en[m - 1]} ${y}`; };
const monthTxt = s => { const [y, m] = s.split('-').map(Number); return LANG === 'es' ? `${MES[m - 1]} de ${y}` : `${MEN[m - 1]} ${y}`; };
const dayMonth = (m, d) => LANG === 'es' ? `${d} de ${MES[m - 1]}` : `${d} ${MEN[m - 1]}`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const PD = s => d3.timeParse('%Y-%m-%d')(s);
const DAYS = (a, b) => Math.round((PD(b) - PD(a)) / 864e5);
const Cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const nn = (n, es, en) => LANG === 'es' ? `${fmt(n)} ${n === 1 ? es[0] : es[1]}` : `${fmt(n)} ${n === 1 ? en[0] : en[1]}`;
const andList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + L(' y ', ' and ') + a[a.length - 1];
const median = a => { const s = [...a].sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; };
const yr = s => s.slice(0, 4);

// ------------------------------------------------------------------ norms, ranks and names
const RK = {
  'constitucion': [['Constitución', 'Constitución'], ['Constitution', 'Constitution']],
  'ley-organica': [['ley orgánica', 'leyes orgánicas'], ['organic law', 'organic laws']],
  'ley': [['ley', 'leyes'], ['law', 'laws']],
  'real-decreto-ley': [['real decreto-ley', 'reales decretos-leyes'], ['royal decree-law', 'royal decree-laws']],
  'real-decreto-legislativo': [['real decreto legislativo', 'reales decretos legislativos'], ['royal legislative decree', 'royal legislative decrees']],
  'real-decreto': [['real decreto', 'reales decretos'], ['royal decree', 'royal decrees']],
  'orden': [['orden', 'órdenes'], ['order', 'orders']],
  'resolucion': [['resolución', 'resoluciones'], ['resolution', 'resolutions']],
  'circular': [['circular', 'circulares'], ['circular', 'circulars']],
  'instruccion': [['instrucción', 'instrucciones'], ['instruction', 'instructions']],
  'acuerdo-internacional': [['acuerdo internacional', 'acuerdos internacionales'], ['international agreement', 'international agreements']],
  'decreto': [['decreto', 'decretos'], ['decree', 'decrees']],
  'decreto-ley': [['decreto-ley', 'decretos-leyes'], ['decree-law', 'decree-laws']],
  'acuerdo': [['acuerdo', 'acuerdos'], ['agreement', 'agreements']],
  'reglamento': [['reglamento', 'reglamentos'], ['rules of procedure', 'rules of procedure']] };
const rk = (k, n = 2) => { const r = RK[k]; if (!r) return k; return L(r[0][n === 1 ? 0 : 1], r[1][n === 1 ? 0 : 1]); };
const Rk = (k, n = 2) => Cap(rk(k, n));
// a norm's citation in the page's language: 'Ley 62/2003, de 30 de diciembre' -> 'Law 62/2003 of 30 December'
const KEN = [['Real Decreto-ley', 'Royal Decree-law'], ['Real Decreto Ley', 'Royal Decree-law'], ['Real Decreto Legislativo', 'Royal Legislative Decree'], ['Real Decreto', 'Royal Decree'],
  ['Ley Orgánica', 'Organic Law'], ['Ley', 'Law'], ['Orden', 'Order'], ['Instrucción', 'Instruction'], ['Circular', 'Circular'], ['Decreto-ley', 'Decree-law'], ['Decreto', 'Decree'], ['Sentencia', 'Judgment']];
const MESRX = MES.join('|');
function cite(s) {
  if (!s) return '';
  s = s.replace(/^(la|el) /, '');
  if (LANG === 'es') return s;
  let m = s.match(new RegExp(`^(${KEN.map(k => k[0]).join('|')})\\s+([\\w/.]+),?\\s+de (\\d{1,2}) de (${MESRX})(?: de (\\d{4}))?`));
  if (m) { const k = KEN.find(q => q[0] === m[1]); return `${k[1]} ${m[2]} of ${m[3]} ${MEN[MES.indexOf(m[4])]}${m[5] ? ' ' + m[5] : ''}`; }
  m = s.match(new RegExp(`^(Resolución|Sentencia del TS|Sentencia|Auto del TS|Reforma|Real Decreto|Ley|Orden|Decreto|Real Orden) de (\\d{1,2}) de (${MESRX}) de (\\d{4})`));
  if (m) { const k = { 'Resolución': 'Resolution', 'Sentencia del TS': 'Supreme Court judgment', 'Sentencia': 'Judgment', 'Auto del TS': 'Supreme Court order', 'Reforma': 'Amendment', 'Real Decreto': 'Royal Decree', 'Ley': 'Law', 'Orden': 'Order', 'Decreto': 'Decree', 'Real Orden': 'Royal Order' }[m[1]];
    return `${k} of ${m[2]} ${MEN[MES.indexOf(m[3])]} ${m[4]}`; }
  return s;
}
// the norm's citation, cut from its title ('Ley 37/1992, de 28 de diciembre, del Impuesto...' -> 'Ley 37/1992, de 28 de diciembre')
function citeOf(title) {
  const m = (title || '').match(new RegExp(`^(.*?\\bde \\d{1,2} de (?:${MESRX})(?: de \\d{4})?)`));

part('p2', 'II. Cómo cambia el derecho', 'II. How the law changes',
  'Cada commit del historial es una norma que cambia el texto de otras el día en que el cambio entra en vigor, y el BOE la nombra como autora. Un cambio es aquí una norma que modifica otra en un día: quién los hace, qué normas reciben más, las leyes que cambian decenas de normas a la vez y los textos refundidos que recogen los cambios acumulados.',
  'Each commit of the history is a norm changing the text of others on the day the change takes effect, and the BOE names it as the author. A change here is one norm amending another on one day: who makes them, which norms receive the most, the laws that change dozens of norms at once, and the consolidated texts that gather the changes made over the years.');

// 4. who changes the law
const AG = ['L', 'RDL', 'RDLeg', 'RD', 'O', 'Res', 'J', 'X'];
const agName = k => LA({ L: ['leyes y leyes orgánicas', 'laws and organic laws'], RDL: ['reales decretos-leyes', 'royal decree-laws'], RDLeg: ['reales decretos legislativos', 'royal legislative decrees'],
  RD: ['reales decretos', 'royal decrees'], O: ['órdenes', 'orders'], Res: ['resoluciones, circulares e instrucciones', 'resolutions, circulars and instructions'],
  J: ['sentencias (Constitucional y Supremo)', 'judgments (Constitutional and Supreme Courts)'], X: ['otras y sin nombre', 'other and unnamed'] }[k]);
const agCol = k => css({ L: '--s1', RDL: '--s2', RDLeg: '--s7', RD: '--s3', O: '--s4', Res: '--s5', J: '--s8', X: '--muted-mark' }[k]);
chart('c04', el => {
  const c = D.c04, Y = c.years, i0 = Y.indexOf(2000), tot = i => sum(AG, k => c.all[k][i]), totL = i => sum(AG, k => c.law[k][i]);
  const since = (k, key = 'all') => sum(Y.map((y, i) => i >= i0 ? c[key][k][i] : 0)), all00 = sum(AG, k => since(k));
  const i20 = Y.indexOf(2020), p20 = c.law.RDL[i20] / totL(i20), peak = Y.reduce((a, y, i) => tot(i) > tot(a) ? i : a, 0);
  const over = Y.filter((y, i) => c.law.RDL[i] > c.law.L[i]), pL20 = c.law.L[i20] / totL(i20);
  return {
    title: L(`Quién cambia el derecho: desde 2000, el ${pct(since('RD'), all00)} de los cambios los hacen reales decretos; en 2020, el ${pv(100 * p20)} de los cambios en las leyes los hicieron reales decretos-leyes`,
      `Who changes the law: since 2000, royal decrees have made ${pct(since('RD'), all00)} of the changes; in 2020, royal decree-laws made ${pv(100 * p20)} of the changes to laws`),
    toc: L('Quién cambia el derecho', 'Who changes the law'),
    dek: L(`Cada cambio es una norma que modifica el texto de otra en un día; desde 1979 hay ${fmt(c.n)}. Desde 2000, los reales decretos hacen el ${pct(since('RD'), all00)}, las leyes y leyes orgánicas el ${pct(since('L'), all00)}, las órdenes el ${pct(since('O'), all00)} y los reales decretos-leyes el ${pct(since('RDL'), all00)}. El año con más cambios es ${Y[peak]} (${fmt(tot(peak))}). Abajo, solo los cambios en normas con rango de ley: los reales decretos-leyes hicieron más que las leyes en ${fmt(over.length)} años, ${andList(over.map(String))}; en 2020, el ${pv(100 * p20)} frente al ${pv(100 * pL20)} de las leyes.`,
      `Each change is one norm amending the text of another on one day; there are ${fmt(c.n)} since 1979. Since 2000, royal decrees have made ${pct(since('RD'), all00)} of them, laws and organic laws ${pct(since('L'), all00)}, orders ${pct(since('O'), all00)} and royal decree-laws ${pct(since('RDL'), all00)}. The year with the most changes is ${Y[peak]} (${fmt(tot(peak))}). Below, only the changes to norms with the rank of law: royal decree-laws made more of them than laws did in ${fmt(over.length)} years, ${andList(over.map(String))}; in 2020, ${pv(100 * p20)} against ${pv(100 * pL20)} by laws.`),

      legend(el, AG.map(k => ({ c: agCol(k), l: agName(k) })));

      const y = d3.scaleLinear().domain([0, d3.max(Y, (_, i) => tot(i))]).nice().range([ih, 0]);
      yAxis(g, y, iw, 5);
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      Y.forEach((yy, i) => {
        let acc = 0; const bx = x(yy), bw = x.bandwidth(), segs = AG.map(k => [k, c.all[k][i]]).filter(s => s[1]), gg = g.append('g').attr('opacity', yy === 2026 ? .5 : 1);
        segs.forEach(([k, v], q) => { const y0 = y(acc) - (q ? .6 : 0), y1 = y(acc + v); acc += v; gg.append('path').attr('d', q === segs.length - 1 ? colPath(bx, y0, bw, y1, Math.min(2.5, bw / 3)) : `M${bx},${y0}V${y1 + .6}H${bx + bw}V${y0}Z`).attr('fill', agCol(k)); });
        if (yy % (nw ? 10 : 5) === 0) g.append('text').attr('class', 'lbl').attr('x', bx + bw / 2).attr('y', ih + 15).attr('text-anchor', 'middle').text(yy);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', bx - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', 0).attr('height', ih).datum(i),
          d => `<b>${Y[d]}${Y[d] === 2026 ? ' (' + t('partial') + ')' : ''}</b>` + AG.map(k => c.all[k][d] ? trow(agCol(k), agName(k), fmt(c.all[k][d])) : '').join('') + trow(null, t('total'), fmt(tot(d))));
      });
      halo(g, x(Y[peak]) + x.bandwidth() / 2, y(tot(peak)) - 6, `${Y[peak]}: ${fmt(tot(peak))}`, 'middle', 'lbl strong');
      // the changes to norms with the rank of law, shares

      const y2 = d3.scaleLinear().domain([0, 1]).range([ih2, 0]);

        let acc = 0; const bx = x(yy), bw = x.bandwidth(), gg = g2.append('g').attr('opacity', yy === 2026 ? .5 : 1);
        LG.forEach(k => { const v = lv(k, i); if (!v) return; const y0 = y2(acc / T), y1 = y2((acc + v) / T); acc += v; gg.append('rect').attr('x', bx).attr('width', bw).attr('y', y1).attr('height', Math.max(0, y0 - y1 - .6)).attr('fill', agCol(k)); });
        if (yy % (nw ? 10 : 5) === 0) g2.append('text').attr('class', 'lbl').attr('x', bx + bw / 2).attr('y', ih2 + 15).attr('text-anchor', 'middle').text(yy);
        bindTip(g2.append('rect').attr('class', 'hit').attr('x', bx - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', 0).attr('height', ih2).datum(i),
          d => `<b>${Y[d]}</b>` + LG.map(k => lv(k, d) ? trow(agCol(k), lgName(k), `${fmt(lv(k, d))} · ${pct(lv(k, d), totL(d))}`) : '').join('') + trow(null, t('total'), fmt(totL(d))));
      });
      halo(g2, x(2020) + x.bandwidth() / 2, y2(1 - c.law.RDL[i20] / totL(i20) / 2) + 4, pv(100 * p20), 'middle', 'lbl strong', '#fff').style('stroke', agCol('RDL'));
      note(el, ['git log (Norma:, In-force:)', 'estatal/<RANGO>/'], `${fmt(c.n)} ${L('cambios', 'changes')} (1979–2026)`,
        L(`un cambio es una norma que escribe el texto de otra en un día (un commit y una norma de su lista); no cuentan el primer texto de una norma ni las partes de una norma que ella misma pone en vigor más tarde. La norma que cambia es la autora del commit; ${fmt(c.unnamed)} cambios tienen solo un identificador del BOE sin nombre y van con «otras». Rango de ley: leyes, leyes orgánicas, reales decretos-leyes y legislativos, y los códigos publicados por real decreto (Código Civil, Código de Comercio, Ley de Enjuiciamiento Criminal, Ley Hipotecaria). Solo cuentan los cambios en normas que el registro contiene: las normas derogadas antes de que el BOE las consolidara no están. 2026 llega al 28 de octubre (más claro).`,
          `a change is one norm writing the text of another on one day (a commit and one norm of its list); a norm’s first text and the parts of a norm it brings into force itself later do not count. The changing norm is the commit’s author; ${fmt(c.unnamed)} changes carry only a BOE identifier with no name and count as “other”. Rank of law: laws, organic laws, royal decree-laws and legislative decrees, and the codes published by royal decree (Civil Code, Commercial Code, Criminal Procedure Act, Mortgage Act). Only changes to norms the record holds count: norms repealed before the BOE consolidated them are missing. 2026 runs to 28 October (lighter).`));
      table(el, [t('year'), ...AG.map(agName), t('total'), L('En normas con rango de ley', 'To norms with the rank of law'), L('De ellos, por reales decretos-leyes', 'Of which by royal decree-laws')],
        Y.map((yy, i) => [String(yy), ...AG.map(k => c.all[k][i]), tot(i), totL(i), c.law.RDL[i]]));
    }
  };
});

part('p3', 'III. Las Cortes y el Gobierno', 'III. The Cortes and the Government',

  'Laws are passed by the Cortes Generales; royal decree-laws are made by the Government “in case of extraordinary and urgent need”, and the Congreso convalidates or repeals them (article 86 of the Constitution). How many of each there were under each Prime Minister, the months laws arrive in, the Congreso’s vote on decree-laws, decree-laws that amend one another, and the budget laws.');

const GOVN = { suarez: ['Adolfo Suárez', 'Adolfo Suárez'], calvo: ['Leopoldo Calvo-Sotelo', 'Leopoldo Calvo-Sotelo'], gonzalez: ['Felipe González', 'Felipe González'], aznar: ['José María Aznar', 'José María Aznar'],
  zapatero: ['José Luis Rodríguez Zapatero', 'José Luis Rodríguez Zapatero'], rajoy: ['Mariano Rajoy', 'Mariano Rajoy'], sanchez: ['Pedro Sánchez', 'Pedro Sánchez'] };
const GOVS = { suarez: 'Suárez', calvo: 'Calvo-Sotelo', gonzalez: 'González', aznar: 'Aznar', zapatero: 'Zapatero', rajoy: 'Rajoy', sanchez: 'Sánchez' };

chart('c08', el => {

  const per = (g, k) => c.gov[k][g.g] || 0, rate = (g, k) => per(g, k) / g.yrs;

      const w = W(el), h = nw ? 240 : 290, m = { t: 26, r: 8, b: 22, l: nw ? 30 : 36 };

      periodBands(g, x, ih, G.map(gv => [() => [GOVS[gv.g], GOVS[gv.g].slice(0, 3) + '.'], gv.a, gv.b]), Y[0], Y[Y.length - 1] + 1, { top: -m.t + 2 });

        if (og) g.append('path').attr('d', colPath(x0, y(lo) - (lo ? .6 : 0), bw, y(lo + og), 1.5)).attr('fill', k3Col('Ley Orgánica')).attr('opacity', op1 * part_);
        if (rd) g.append('path').attr('d', colPath(x0 + bw + .6, ih, bw, y(rd), 1.5)).attr('fill', k3Col('Real Decreto-ley')).attr('opacity', op2 * part_);
        if (yy % (nw ? 10 : 5) === 0) g.append('text').attr('class', 'lbl').attr('x', x(yy) + step / 2).attr('y', ih + 15).attr('text-anchor', 'middle').text(yy);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x(yy)).attr('width', step).attr('y', 0).attr('height', ih).datum(i),

// 9. laws by month, and the longest stretches without an ordinary law
chart('c09', el => {

  return {
    title: L(`Diciembre reúne el ${pct(Mo[11], tM)} de las leyes de 2004 a 2025; entre octubre de 2015 y abril de 2017 pasaron ${fmt(g0[0])} días sin una ley ordinaria`,
      `December holds ${pct(Mo[11], tM)} of the laws of 2004–2025; between October 2015 and April 2017, ${fmt(g0[0])} days passed without an ordinary law`),
    toc: L('Leyes por mes', 'Laws by month'),

      const lw = nw ? 26 : 34, rw = nw ? 64 : 120, cw = (w - lw - rw - 8) / Y.length, ch = nw ? 15 : 22, m = { t: 18, l: lw }, ih = ch * 12;
      const svg = svgIn(el, w, m.t + ih + 64), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);

          if (n >= 3 && cw > 30 && ch > 18) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', (mth - 1) * ch + ch / 2 + 4).attr('text-anchor', 'middle').style('fill', inkOn(cl(n))).style('pointer-events', 'none').text(n);

// 10. the Congreso's vote on each decree-law

part('p4', 'IV. El calendario del BOE', 'IV. The BOE’s calendar',

      note(el, ['git log --author="Sentencia"', 'estatal/<RANGO>/'], `${fmt(nTC + nTS)} ${L('sentencias y autos', 'judgments and orders')}`,
        L(`una sentencia numerada («Sentencia 31/2010, de 28 de junio») es del Tribunal Constitucional; las del Supremo llevan «TS» o solo la fecha («Sentencia de 29 de abril de 2026»), y con ellas se cuentan los autos del Supremo. El año es el de la sentencia. Solo las que el BOE registra como cambio del texto: las que anulan sin que el BOE cambie el texto consolidado, o las anteriores a que el BOE las atribuyera así, no están. ${fmt(c.annulled.length)} normas constan como anuladas enteras (gráfico 1). 2026 llega al 28 de octubre (más claro).`,
          `a numbered judgment (“Sentencia 31/2010, de 28 de junio”) is the Constitutional Court’s; the Supreme Court’s carry “TS” or only a date (“Sentencia de 29 de abril de 2026”), and the Supreme Court’s orders (autos) count with them. The year is the ruling’s. Only rulings the BOE records as changing the text: those that annul without the BOE changing the consolidated text, or that came before the BOE credited them this way, are missing. ${fmt(c.annulled.length)} norms are recorded as annulled in full (chart 1). 2026 runs to 28 October (lighter).`));
      table(el, [t('year'), L('Constitucional: sentencias', 'Constitutional: judgments'), L('Constitucional: bloques', 'Constitutional: blocks'), L('Supremo: sentencias', 'Supreme: rulings'), L('Supremo: bloques', 'Supreme: blocks')],
        YS.map(y => [String(y), (c.tc[y] || [0, 0])[0], (c.tc[y] || [0, 0])[1], (c.ts[y] || [0, 0])[0], (c.ts[y] || [0, 0])[1]]));
      subTable(el, L('Normas más cambiadas por el Constitucional', 'Norms changed most by the Constitutional Court'), [L('Norma', 'Norm'), L('Cambios', 'Changes')], c.tc_top.map(r => [r[1], r[2]]), [0, 1]);
    }
  };
});

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Normas y sus bloques', 'Norms and their blocks'), 'estatal/<RANGO>/<AÑO>/<ID>/<BLOQUE>.md', fmt(P.text), L(`las normas de ámbito estatal de la legislación consolidada del BOE, con un archivo por bloque (${fmt(P.files)} archivos)`, `the BOE’s consolidated state norms, one file per block (${fmt(P.files)} files)`), L('no está el derecho autonómico ni las normas que el BOE no consolida', 'regional law and norms the BOE does not consolidate are not included')],
    [L('Situación de cada norma', 'Status of each norm'), 'data/acts.json · normas.tsv', fmt(P.norms), L(`en vigor ${fmt(P.in_force)}, derogadas ${fmt(P.repealed)}, con fechas de disposición, publicación, entrada en vigor y derogación`, `in force ${fmt(P.in_force)}, repealed ${fmt(P.repealed)}, with the dates of enactment, publication, entry into force and repeal`), L('las derogaciones que el registro conoce son sobre todo de 2010 en adelante', 'the repeals the record knows of are mostly from 2010 on')],
    [L('Historial de git', 'Git history'), 'git log origin/main', fmt(P.commits), L(`un commit por norma modificadora y día de entrada en vigor (In-force:, Published:, Norma:), con la lista de normas y bloques que cambia; ${fmt(P.changes)} cambios de una norma por otra`, `one commit per amending norm and day of entry into force (In-force:, Published:, Norma:), listing the norms and blocks it changes; ${fmt(P.changes)} changes of one norm by another`), L('el historial de cada norma empieza en su primer texto consolidado; las normas que el BOE no consolida no están', 'each norm’s history starts at its first consolidated text; norms the BOE does not consolidate are missing')],
    [L('Correcciones', 'Corrections'), 'Kind: correction', fmt(P.corrections), L('derogaciones, anulaciones, versiones del mismo día y fechas, añadidas después y etiquetadas', 'repeals, annulments, same-day versions and dates, appended later and labelled'), L('no cuentan como cambios en los gráficos', 'not counted as changes in the charts')],
    [L('Notas del BOE', 'BOE notes'), 'estatal/real-decreto-ley/<AÑO>/<ID>/no.md · ir.md', fmt(P.rdl_notes), L('reales decretos-leyes de 2017 a 2026 con una nota sobre su convalidación o derogación por el Congreso', 'royal decree-laws of 2017–2026 with a note on their convalidation or repeal by the Congreso'), L('sistemáticas solo desde 2020', 'systematic only from 2020')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  const tr = s => Object.entries(PH).reduce((a, [x, y]) => a.split(x).join(LA(y)), s);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(tr(v))}</code>` : esc(v));
}
// a label that runs past the edge of its chart's card would be cut: report it (the charts size their columns to their labels)
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i).replace('{norms}', fmt(PF.text)); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tv = [[fmt(PF.text), L('normas estatales con texto', 'state norms with text')], [fmt(PF.in_force), L('en vigor', 'in force')], [fmt(PF.files), L('bloques (un archivo cada uno)', 'blocks (one file each)')],
    [fmt(PF.commits), L('commits de cambios del BOE', 'commits of BOE changes')], [fmt(PF.changes), L('cambios de una norma por otra', 'changes of one norm by another')], [yr(PF.history_from), L('año del primer texto en vigor', 'year of the oldest text in force')]];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html(d => `<b>${d[0]}</b><span>${d[1]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.es, c.en)); sec.append('p').attr('class', 'pd').text(L(c.des, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.es, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')).replace('{record}', dateTxt(PF.record_to)));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('es-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('es-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
